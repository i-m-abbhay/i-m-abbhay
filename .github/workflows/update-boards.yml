name: Update boards

on:
  schedule:
    - cron: "0 15 * * *"  # 00:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Redraw timetable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python timetable.py assets/timetable.svg
      - name: Redraw Medium arrivals board
        run: python medium.py
      - name: Commit if changed
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update timetable and Medium board"
          git push
