<style>
.led{font:700 16px ui-monospace,SFMono-Regular,Consolas,Menlo,'Liberation Mono',monospace,'Yu Gothic','Meiryo','Hiragino Sans','Noto Sans JP';fill:#ffb000}
.via{font:600 13px ui-monospace,SFMono-Regular,Consolas,Menlo,'Liberation Mono',monospace,'Yu Gothic','Meiryo','Hiragino Sans','Noto Sans JP';fill:#a8740a}
.h{font:700 12px ui-monospace,SFMono-Regular,Consolas,Menlo,'Liberation Mono',monospace,'Yu Gothic','Meiryo','Hiragino Sans','Noto Sans JP';fill:#a8740a;letter-spacing:2px}
.title{font:800 20px ui-monospace,SFMono-Regular,Consolas,Menlo,'Liberation Mono',monospace;fill:#ffb000;letter-spacing:5px}
.titlejp{font:700 16px 'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic','Meiryo','Noto Sans JP',sans-serif;fill:#ffb000}
.en{animation:en 8s infinite}.ja{animation:ja 8s infinite}
@keyframes en{0%,44%{opacity:1}50%,94%{opacity:0}100%{opacity:1}}
@keyframes ja{0%,44%{opacity:0}50%,94%{opacity:1}100%{opacity:0}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.tick{animation:tick 34s linear infinite}
@keyframes tick{0%{transform:translateX(0)}100%{transform:translateX(-2300px)}}
</style>
