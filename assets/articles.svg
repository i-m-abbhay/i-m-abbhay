<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 290" width="830" height="290">
<defs><pattern id="dots" width="3" height="3" patternUnits="userSpaceOnUse">
<rect x="2" width="1" height="3" fill="#000"/><rect y="2" width="3" height="1" fill="#000"/>
</pattern></defs>
<style>
.led{font:700 15px ui-monospace,SFMono-Regular,Consolas,Menlo,'Liberation Mono',monospace,'Yu Gothic','Meiryo','Hiragino Sans','Noto Sans JP';fill:#ffb000}
.h{font:700 12px ui-monospace,SFMono-Regular,Consolas,Menlo,'Liberation Mono',monospace,'Yu Gothic','Meiryo','Hiragino Sans','Noto Sans JP';fill:#a8740a;letter-spacing:2px}
.title{font:800 20px ui-monospace,SFMono-Regular,Consolas,Menlo,'Liberation Mono',monospace;fill:#ffb000;letter-spacing:5px}
.titlejp{font:700 16px 'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic','Meiryo','Noto Sans JP',sans-serif;fill:#ffb000}
.new{font:700 12px ui-monospace,SFMono-Regular,Consolas,Menlo,'Liberation Mono',monospace,'Yu Gothic','Meiryo','Hiragino Sans','Noto Sans JP';fill:#3ddc84}
.en{animation:en 8s infinite}.ja{animation:ja 8s infinite}
@keyframes en{0%,44%{opacity:1}50%,94%{opacity:0}100%{opacity:1}}
@keyframes ja{0%,44%{opacity:0}50%,94%{opacity:1}100%{opacity:0}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style>
<rect x="4" y="4" width="822" height="282" rx="14" fill="#16181b" stroke="#30363d" stroke-width="2"/>
<rect x="22" y="22" width="786" height="250" rx="6" fill="#050505"/>
<text x="40" y="56" class="title">ARRIVALS</text>
<text x="180" y="55" class="titlejp">到着案内</text>
<text x="790" y="55" class="h en" text-anchor="end">FROM: medium.com/@abhay.tiwari.er</text><text x="790" y="55" class="h ja" text-anchor="end">発: medium.com/@abhay.tiwari.er</text>
<text x="40" y="88" class="h en">DATE</text><text x="40" y="88" class="h ja">日付</text><text x="122" y="88" class="h en">LINE</text><text x="122" y="88" class="h ja">路線</text><text x="210" y="88" class="h en">ARTICLE</text><text x="210" y="88" class="h ja">記事</text>
<line x1="34" y1="98" x2="796" y2="98" stroke="#2a2a2a"/>
<text x="40" y="126" class="led en">OCT 15</text><text x="40" y="126" class="led ja">10月15日</text>
<text x="122" y="126" class="led en" style="fill:#ffd166">Infra</text><text x="122" y="126" class="led ja" style="fill:#ffd166">インフラ</text>
<text x="210" y="126" class="led en">We Were About to Pay ¥50,000 More a Month for a Bigger Disk.</text><text x="210" y="126" class="led ja">大きいディスクに月5万円多く払うところだった。</text>
<g class="blink"><text x="790" y="126" class="new en" text-anchor="end">NEW</text><text x="790" y="126" class="new ja" text-anchor="end">新着</text></g>
<line x1="34" y1="137" x2="796" y2="137" stroke="#1a1a1a"/>
<text x="40" y="158" class="led en">SEP 25</text><text x="40" y="158" class="led ja">9月25日</text>
<text x="122" y="158" class="led en" style="fill:#ffd166">Infra</text><text x="122" y="158" class="led ja" style="fill:#ffd166">インフラ</text>
<text x="210" y="158" class="led en">Object Storage for VPS Developers</text><text x="210" y="158" class="led ja">VPS開発者のためのオブジェクトストレージ</text>
<line x1="34" y1="169" x2="796" y2="169" stroke="#1a1a1a"/>
<text x="40" y="190" class="led en">SEP 15</text><text x="40" y="190" class="led ja">9月15日</text>
<text x="122" y="190" class="led en" style="fill:#79c0ff">Net</text><text x="122" y="190" class="led ja" style="fill:#79c0ff">通信</text>
<text x="210" y="190" class="led en">How to make your own Protocol (like HTTP) in 10 minutes</text><text x="210" y="190" class="led ja">10分で作る、HTTPのような自作プロトコル</text>
<line x1="34" y1="201" x2="796" y2="201" stroke="#1a1a1a"/>
<text x="40" y="222" class="led en">SEP 10</text><text x="40" y="222" class="led ja">9月10日</text>
<text x="122" y="222" class="led en" style="fill:#2bb3a3">Web</text><text x="122" y="222" class="led ja" style="fill:#2bb3a3">ウェブ</text>
<text x="210" y="222" class="led en">All About HTTP Headers</text><text x="210" y="222" class="led ja">HTTPヘッダーのすべて</text>
<line x1="34" y1="233" x2="796" y2="233" stroke="#1a1a1a"/>
<text x="40" y="254" class="led en">JUL 06</text><text x="40" y="254" class="led ja">7月6日</text>
<text x="122" y="254" class="led en" style="fill:#ff7b72">Essay</text><text x="122" y="254" class="led ja" style="fill:#ff7b72">随筆</text>
<text x="210" y="254" class="led en">AI is making me faster, but I feel empty afterwards.</text><text x="210" y="254" class="led ja">AIで速くなった。でも、あとに残るのは虚しさ。</text>
<line x1="34" y1="265" x2="796" y2="265" stroke="#1a1a1a"/>
<rect x="22" y="22" width="786" height="250" rx="6" fill="url(#dots)" opacity=".45"/>
